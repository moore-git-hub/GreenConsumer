<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1720" viewBox="0 0 1400 1720" role="img" aria-labelledby="title desc">
  <title id="title">v3.3.1论文技术路线图</title>
  <desc id="desc">展示研究定位、理论证据、GABM构建、工程验证、Pilot、正式实验和论文综合的顺序及当前状态。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#17324D"/><stop offset="1" stop-color="#245B78"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#183042" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#44647A"/></marker>
    <style>
      .zh{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;fill:#183042}
      .title{font-size:34px;font-weight:700;fill:#fff}.subtitle{font-size:18px;fill:#DCEAF2}
      .phase{font-size:24px;font-weight:700}.en{font-size:14px;font-weight:700;letter-spacing:.8px}
      .box-title{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}
      .flow{fill:none;stroke:#44647A;stroke-width:3;marker-end:url(#arrow)}
      .done{fill:#E8F4EC;stroke:#4F9B76}.partial{fill:#FFF4D6;stroke:#D9AE45}.pending{fill:#F3F5F7;stroke:#99A8B3}
      .card{stroke-width:2}.gate{fill:#FFFFFF;stroke:#6F8798;stroke-width:1.5;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1400" height="1720" fill="#F7FAFC"/>
  <rect width="1400" height="112" fill="url(#header)"/>
